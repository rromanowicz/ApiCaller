spring:
  application:
    name: apicaller-test

springdoc:
  swagger-ui:
    enabled: true

logging:
  level:
    root: WARN
    com:
      rromanowicz:
        apicaller: INFO

app:
  request:
    headers:
      h1: asd
      h2: zxc
      h3: 123
  apis:
    fakeStore:
      base: "https://fakestoreapi.com"
      users: "/users"
  logging:
    masking:
      outgoing:
        - url: "/users"
          request:
            body:
              - pattern: "(.*\\\"username\\\":\\\".)(.*?)(.\\\".*)"
                substitution: "$1***$3"
              - pattern: "(.*\\\"email\\\":\\\".)(.*?)(.\\\".*)"
                substitution: "$1***$3"
              - pattern: "(.*\\\"password\\\":\\\")(.*?)(\\\".*)"
                substitution: "$1***$3"
            header:
              - name: "h1"
                replacement: ""
                remove: true
              - name: "h2"
                replacement: "***"
                remove: false
          response:
            body:
              - pattern: "(.*\\\"username\\\":\\\".)(.*?)(.\\\".*)"
                substitution: "$1***$3"
              - pattern: "(.*\\\"email\\\":\\\".)(.*?)(.\\\".*)"
                substitution: "$1***$3"
              - pattern: "(.*\\\"password\\\":\\\")(.*?)(\\\".*)"
                substitution: "$1***$3"
      incoming:
        - url: "/v1/test-x"
          request:
            body:
              - pattern: "(.*\\\"username\\\":\\\".)(.*?)(.\\\".*)"
                substitution: "$1***$3"
              - pattern: "(.*\\\"email\\\":\\\".)(.*?)(.\\\".*)"
                substitution: "$1***$3"
              - pattern: "(.*\\\"password\\\":\\\")(.*?)(\\\".*)"
                substitution: "$1***$3"

